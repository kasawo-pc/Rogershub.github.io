<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Log in | Rogers Tech Hub</title><link rel="stylesheet" href="site.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.auth-layout{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#080d18}.auth-side{padding:clamp(28px,7vw,85px);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,#172947,#0b1321);border-right:1px solid var(--line)}.auth-side h1{font-size:clamp(2.5rem,5vw,4rem)}.auth-side h1 span{color:#aebdff}.auth-side p{color:var(--muted)}.auth-form-side{display:grid;place-items:center;padding:25px}.auth-panel{width:min(100%,470px);padding:clamp(25px,4vw,40px);background:linear-gradient(145deg,#101a2b,#0c1423);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 80px #0005}.auth-panel h2{font-size:2rem}.auth-panel label{display:block;margin:18px 0 7px;color:#c6d0df}.auth-panel input{width:100%;padding:14px;border:1px solid #34435c;border-radius:12px;background:#091221;color:white}.auth-panel input:focus{outline:2px solid #718bff88}.auth-panel button[type=submit]{width:100%;padding:14px;margin-top:20px;border:0;border-radius:12px;background:linear-gradient(120deg,#6d8cff,#8b69ff);color:white;font-weight:700;cursor:pointer}.auth-panel button:disabled{opacity:.65}.auth-links{color:var(--muted);margin-top:20px}.auth-links a,.auth-back{color:#aebdff}.auth-status{min-height:24px;color:#65e0d2}.auth-back{display:inline-block;margin-bottom:20px}@media(max-width:800px){.auth-layout{grid-template-columns:1fr}.auth-side{padding:25px;min-height:auto}.auth-side h1{font-size:2.5rem;margin:25px 0 10px}.auth-form-side{padding:20px 14px 40px}.auth-panel{padding:24px}}</style></head><body><div class="auth-layout"><aside class="auth-side"><a href="index.html" style="font-weight:700">RH · Rogers Tech Hub</a><h1>Welcome<br><span>back.</span></h1><p>Sign in securely to continue to your member dashboard.</p><p>• Secure email verification<br>• Member access<br>• Connect with our digital services</p></aside><main class="auth-form-side"><section class="auth-panel"><a class="auth-back" href="index.html">← Back to website</a><h2>Member login</h2><p>Enter your account details to continue.</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" placeholder="Your password"><button type="submit">Login →</button></form><button type="button" id="forgotPassword" style="background:transparent;border:0;color:#aebdff;padding:12px 0;cursor:pointer">Forgot password?</button><p id="status" class="auth-status" role="status" aria-live="polite"></p><p class="auth-links">New here? <a href="signup.html">Create an account</a></p></section></main></div><script src="auth.js"></script><script src="/site.js?v=20261126-assistant" defer></script></body></html>
