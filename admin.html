<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080d18"><title>Admin Login · Rogers Hub</title><link rel="stylesheet" href="site.css?v=admin-login"><style>
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 20% 10%,#526eff30,transparent 38%),#080d18;color:#f4f7ff;font-family:"DM Sans",Arial,sans-serif}.login{width:min(440px,calc(100% - 32px));padding:34px;border:1px solid #ffffff20;border-radius:22px;background:linear-gradient(145deg,#142239,#0b1424);box-shadow:0 28px 90px #0008}.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#6d8cff,#8b69ff);font-weight:800}.muted{color:#9ba9bd}.field{margin:18px 0}.field label{display:block;margin-bottom:7px;font-size:.9rem}.field input{width:100%;padding:13px 14px;border:1px solid #ffffff25;border-radius:11px;background:#080f1d;color:white}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(120deg,#6d8cff,#8b69ff);color:white;font-weight:700;cursor:pointer}.status{min-height:24px;color:#ffb4b4;font-size:.88rem;margin-top:12px}.back{display:inline-block;margin-top:20px;color:#b9c7ff;text-decoration:none;font-size:.9rem}
</style></head><body><main class="login"><div class="mark">RH</div><p class="muted" style="margin:22px 0 4px">ROGERS HUB · PRIVATE AREA</p><h1 style="margin:0 0 8px">Admin login</h1><p class="muted">Sign in with your administrator email and password.</p><form id="loginForm"><div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" value="rogerrichardpark744@gmail.com" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your admin password" required></div><button class="btn" id="submit" type="submit">Sign in securely</button><p class="status" id="status" role="status" aria-live="polite"></p></form><a class="back" href="index.html">← Back to Rogers Hub</a></main><script>
(async()=>{const form=document.getElementById('loginForm'),status=document.getElementById('status'),button=document.getElementById('submit');try{const r=await fetch('/api/admin-session',{credentials:'same-origin'});if(r.ok){location.replace('/dashboard.html');return}}catch(e){}form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Signing in…';status.textContent='';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Login failed.');location.replace('/dashboard.html')}catch(err){status.textContent=err.message||'Unable to sign in. Try again.';button.disabled=false;button.textContent='Sign in securely'}})})();
</script></body></html>
