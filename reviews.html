<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews & Ratings | Rogers Tech Hub</title><link rel="stylesheet" href="site.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.page{max-width:850px;margin:45px auto 80px}.box,.card{background:#101a2b;border:1px solid #ffffff18;border-radius:18px;padding:22px;margin:18px 0}.field{margin:14px 0}.field label{display:block;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;background:#091221;color:white;border:1px solid #ffffff20;border-radius:10px}.stars button{font-size:2rem;border:0;background:none;color:#ffd36b;cursor:pointer}.status{color:#65e0d2}.links{display:flex;flex-wrap:wrap;gap:12px}header,footer{padding:25px;text-align:center;color:#9ba9bd;border-block:1px solid #ffffff12}header a{color:#c5d2ff}</style></head><body><header><a href="index.html">← Rogers Tech Hub</a> · <a href="login.html">Member login</a></header><main class="wrap page"><h1>Rate Rogers Tech Hub</h1><p>Share your experience with the website.</p><div class="box"><form id="review"><div class="field"><label for="name">Name (optional)</label><input id="name" maxlength="60"></div><label>Rating</label><div class="stars" id="stars"><button type="button" data-v="1" aria-label="1 star">★</button><button type="button" data-v="2" aria-label="2 stars">★</button><button type="button" data-v="3" aria-label="3 stars">★</button><button type="button" data-v="4" aria-label="4 stars">★</button><button type="button" data-v="5" aria-label="5 stars">★</button></div><div class="field"><label for="comment">Review</label><textarea id="comment" rows="4" maxlength="500" required></textarea></div><button class="btn">Submit review</button></form><p id="status" class="status" role="status"></p></div><h2>Community reviews</h2><div id="reviews"><p>Loading reviews…</p></div></main><footer>© Rogers Tech Hub · Connect · Learn · Grow</footer><script>const SUPABASE_URL="https://kmdshraspqvmuqgmzigw.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_gtYteZIQR0X3_ttYZZ0ZCw_F-TC2Qxd";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let rating=0;const stars=document.querySelectorAll('[data-v]');stars.forEach(b=>b.onclick=()=>{rating=+b.dataset.v;stars.forEach(x=>x.style.opacity=+x.dataset.v<=rating?'1':'.35')});async function show(){const box=document.getElementById('reviews');const {data,error}=await db.from('website_reviews').select('name,rating,comment,created_at').order('created_at',{ascending:false}).limit(50);if(error){box.textContent='Reviews are temporarily unavailable.';return;}if(!data.length){box.innerHTML='<p>No reviews yet. Be the first!</p>';return;}box.replaceChildren();data.forEach(r=>{const card=document.createElement('div');card.className='box';const heading=document.createElement('strong');heading.textContent=(r.name||'Guest')+' · '+'★'.repeat(r.rating);const p=document.createElement('p');p.textContent=r.comment;card.append(heading,p);box.append(card);});}show();document.getElementById('review').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('status');if(!rating){status.textContent='Choose a rating first.';return;}status.textContent='Submitting…';const name=document.getElementById('name').value.trim()||'Guest';const comment=document.getElementById('comment').value.trim();const {error}=await db.from('website_reviews').insert({name,rating,comment});if(error){status.textContent='Unable to submit right now. Please try again.';return;}status.textContent='Thank you! Your review is published.';e.target.reset();rating=0;stars.forEach(x=>x.style.opacity='.35');show();};</script></body></html>
