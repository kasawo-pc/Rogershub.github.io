<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews & Ratings | Rogers Hub</title><link rel="stylesheet" href="site.css"><style>.page{max-width:850px;margin:45px auto 80px}.box,.card{background:#101a2b;border:1px solid #ffffff18;border-radius:18px;padding:22px;margin:18px 0}.field{margin:14px 0}.field label{display:block;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;background:#091221;color:white;border:1px solid #ffffff20;border-radius:10px}.stars button{font-size:2rem;border:0;background:none;color:#ffd36b;cursor:pointer}.status{color:#65e0d2}.links{display:flex;flex-wrap:wrap;gap:12px}.links a{padding:10px 14px;background:#17243a;border-radius:12px;color:#c5d2ff}header,footer{padding:25px;text-align:center;color:#9ba9bd;border-block:1px solid #ffffff12}header a{color:#c5d2ff}</style></head><body><header><a href="index.html">← Rogers Hub</a> · <a href="login.html">Member login</a></header><main class="wrap page"><h1>Rate Rogers Hub</h1><p>Share your experience.</p><div class="box"><form id="review"><div class="field"><label>Name (optional)</label><input id="name" maxlength="60"></div><label>Rating</label><div class="stars" id="stars"><button type="button" data-v="1">★</button><button type="button" data-v="2">★</button><button type="button" data-v="3">★</button><button type="button" data-v="4">★</button><button type="button" data-v="5">★</button></div><div class="field"><label>Review</label><textarea id="comment" rows="4" maxlength="500" required></textarea></div><button class="btn">Submit</button></form><p id="status" class="status"></p></div><h2>Reviews saved on this device</h2><div id="reviews"></div></main><footer>© Rogers Hub · Connect · Learn · Grow</footer><script>let rating=0;const stars=document.querySelectorAll('[data-v]');stars.forEach(b=>b.onclick=()=>{rating=+b.dataset.v;stars.forEach(x=>x.style.opacity=+x.dataset.v<=rating?'1':'.35')});function show(){const a=JSON.parse(localStorage.rhReviews||'[]');document.getElementById('reviews').innerHTML=a.map(r=>'<div class="box"><b>'+r.name+'</b> · '+'★'.repeat(r.rating)+'<p>'+r.comment+'</p></div>').join('')}show();document.getElementById('review').onsubmit=e=>{e.preventDefault();if(!rating){document.getElementById('status').textContent='Choose a rating first.';return}const a=JSON.parse(localStorage.rhReviews||'[]');a.unshift({name:document.getElementById('name').value||'Guest',rating,comment:document.getElementById('comment').value});localStorage.rhReviews=JSON.stringify(a.slice(0,30));document.getElementById('status').textContent='Thank you for your review!';e.target.reset();rating=0;show()}</script></body></html>
