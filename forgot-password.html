er your account email to request a recovery code.</p><form id="emailForm"><label for="email">Recovery email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><button class="primary" id="sendBtn">Send recovery code</button></form><form id="codeForm" class="hidden"><label for="code">Recovery verification code</label><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required placeholder="Email code"><button class="primary" id="verifyBtn">Verify code</button><button class="primary" type="button" id="resendBtn" style="background:#263957">Resend code</button></form><form id="passwordForm" class="hidden"><label for="password">New password (at least 8 characters)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button class="primary" id="saveBtn">Save new password</button></form><p id="status" class="status" role="status" aria-live="polite"></p><p class="links" id="loginLink"><a href="login.html">Return to sign in</a> · <a href="signup.html">Create account</a></p></section></main></div><script>(()=>{const URL="https://kmdshraspqvmuqgmzigw.supabase.co",KEY="sb_publishable_gtYteZIQR0X3_ttYZZ0ZCw_F-TC2Qxd", $=id=>document.getElementById(id);if(!window.supabase){$("status").textContent="Auth service failed to load. Refresh.";return;}const sb=window.supabase.createClient(URL,KEY);let email="";function msg(t,err=false){$("status").textContent=t;$("status").style.color=err?"#ff9292":"#65e0d2";}function show(id){["emailForm","codeForm","passwordForm"].forEach(x=>$(x).classList.toggle("hidden",x!==id));}$("emailForm").addEventListener("submit",async e=>{e.preventDefault();email=$("email").value.trim().toLowerCase();let b=$("sendBtn");b.disabled=true;msg("Requesting recovery email…");try{let {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/forgot-password.html"});if(error)throw error;show("codeForm");$("heading").textContent="Check your email";$("intro").textContent="If an account exists, a recovery message was sent to "+email+". Check spam too.";msg("Request sent. Enter the recovery code.");$("code").focus();}catch(err){msg(err.message,true);}finally{b.disabled=false;}});$("codeForm").addEventListener("submit",async e=>{e.preventDefault();let b=$("verifyBtn");b.disabled=true;msg("Verifying…");try{let {data,error}=await sb.auth.verifyOtp({email,token:$("code").value.trim(),type:"recovery"});if(error)throw error;if(!data.session)throw Error("Recovery session missing. Try again.");show("passwordForm");$("heading").textContent="Set a new password";$("intro").textContent="Email verified. Enter your new password.";msg("Verified.");$("password").focus();}catch(err){msg(err.message,true);}finally{b.disabled=false;}});$("resendBtn").onclick=async e=>{let b=e.currentTarget;b.disabled=true;try{let {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/forgot-password.html"});if(error)throw error;msg("Recovery email requested again.");}catch(err){msg(err.message,true);}finally{b.disabled=false;}};$("passwordForm").addEventListener("submit",async e=>{e.preventDefault();let p=$("password").value,c=$("confirm").value,b=$("saveBtn");if(p.length<8||p!==c){msg(p.length<8?"Password must be at least 8 characters.":"Passwords do not match.",true);return;}b.disabled=true;msg("Saving new password…");try{let {error}=await sb.auth.updateUser({password:p});if(error)throw error;await sb.auth.signOut();show(null);$("heading").textContent="Password updated";$("intro").textContent="Your password was reset successfully.";msg("Password updated. Sign in with your new password.");$("loginLink").innerHTML='<a href="login.html">Go to login</a>';}catch(err){msg(err.message,true);}finally{b.disabled=false;}});})();</script><script src="/site.js?v=20261127-recov
